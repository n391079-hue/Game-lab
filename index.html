<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameForge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🎮 GameForge</h1>
    <p>Create your own mini game</p>
</header>

<div class="toolbar">
    <button onclick="setTool('player')">🧍 Player</button>
    <button onclick="setTool('platform')">🟫 Platform</button>
    <button onclick="setTool('coin')">🪙 Coin</button>
    <button onclick="setTool('enemy')">👾 Enemy</button>
    <button onclick="setTool('erase')">🗑️ Erase</button>
    <button onclick="clearGame()">🔄 Clear</button>
    <button onclick="playGame()">▶️ Play</button>
</div>

<div id="status">Tool: Player</div>

<canvas id="gameCanvas" width="900" height="500"></canvas>

<script src="script.js"></script>

</body>
  </html>
